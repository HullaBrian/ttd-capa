name: build

on:
  push:
    branches: [master, metadata-decoding]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  extractor:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          # win32json is only needed to regenerate the API index, which is committed.
          # Cloning it costs several hundred MB for nothing on a normal build.
          submodules: false

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        working-directory: ttd
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Build
        working-directory: ttd
        run: msbuild ttdcapa-extract.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal

      # The extractor delay-loads TTDReplay.dll and takes --ttd-dlls, so it links and
      # runs without Microsoft's replay DLLs present. They are not ours to redistribute;
      # a caller points at the copy WinDbg already installed.
      - name: Check it runs
        working-directory: ttd/bin/x64/Release
        run: |
          ./ttdcapa-extract.exe --dump-sig CreateFileW
          if ($LASTEXITCODE -ne 0) { throw "dump-sig failed" }

      - name: Stage artifacts
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ttd/bin/x64/Release/ttdcapa-extract.exe dist/
          Copy-Item ttd/data/win32-index.bin dist/
          Copy-Item docs/ttdb-format.md dist/
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ttdcapa-extract-x64
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            `ttdcapa-extract.exe` sweeps a TTD trace and writes a `.ttdb` report.

            - `win32-index.bin` must sit beside the executable, or be passed with `--win32-index`.
            - `TTDReplay.dll` and `TTDReplayCPU.dll` are Microsoft's and are not redistributed
              here. Pass `--ttd-dlls <dir>` pointing at WinDbg's `amd64\ttd` folder, or place
              copies beside the executable.
            - `ttdb-format.md` describes the report layout field by field.
